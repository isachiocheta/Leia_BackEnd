        - dashboard
      x-perfis:
        - ADMIN_CLUBE
      security:
        - CookieSessao: []
      parameters: []
      responses:
        "200":
          description: Sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetalheDashboardAdmin"
        "400":
          $ref: "#/components/responses/Erro400"
        "401":
          $ref: "#/components/responses/Erro401"
        "403":
          $ref: "#/components/responses/Erro403"
        "413":
          $ref: "#/components/responses/Erro413"
        "422":
