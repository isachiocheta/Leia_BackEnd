# Fonte contratual das rotas implementadas; validar com npm run verificar:contrato.
openapi: 3.0.3
info:
  title: Leia+ — contrato do backend
  version: 1.0.0
  description: "Um único clube escolar. Contrato das 38 operações explícitas; GET também atende HEAD
    sem corpo e CORS atende preflight OPTIONS com 204. Perfis ADMIN_CLUBE e LEITOR exigem conta
    ATIVO. Cookie leia.sid: HttpOnly, SameSite=Lax, Secure em HTTPS (HTTP local explícito);
    expiração absoluta de 30 minutos conferida no servidor, sem renovação por polling. Revogação por
    sessionVersion (zero válido), senha e desativação. Obter GET /api/auth/csrf com cookies e
    reenviar X-CSRF-Token em mutações, inclusive login/cadastro; após login buscar novo token. Em
    rotas protegidas, autenticação/perfil precedem CSRF. Browser usa credentials: include. CORS
    ALLOWED_ORIGIN explícita, padrão http://localhost:5173, credenciais habilitadas; helmet e
    Cache-Control: no-store. JSON limitado a 102400 bytes. Detalhe {data}, lista {data,meta}, erro
    {error}; 204 sem corpo. Datas civis e limites de período em America/Sao_Paulo. Texto, inclusive
    marcação, permanece dado JSON; este contrato não comprova renderização de interface. Regras de
    campos desconhecidos e filtros estão nas operações; valores SQL são parametrizados e nomes de
    ordenação vêm de mapas internos."
servers:
  - url: http://localhost:3000
    description: HTTP local; PORT configurável.
