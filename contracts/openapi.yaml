        "500":
          $ref: "#/components/responses/Erro500"
        "503":
          $ref: "#/components/responses/Erro503"
  /api/dashboard/me:
    get:
      operationId: leia38
      summary: Dashboard pessoal do leitor
      description: Identidade da sessão, sem query/usuarioId/corpo. Totais em todo histórico, mesmo sem
        ciclo atual. minhaParticipacao null sem adesão, sem criar automaticamente.
        podeAtualizarProgresso é informativo e não substitui autorização da escrita. Agenda própria
        somente AGENDADO/futuro, cinco primeiros por início e inscrição id; total antes do limite.
        Instante/snapshot únicos, sem cache e sem renovar login.
      tags:
        - dashboard
      x-perfis:
        - LEITOR
      security:
        - CookieSessao: []
      parameters: []
      responses:
        "200":
          description: Sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetalheDashboardLeitor"
        "400":
          $ref: "#/components/responses/Erro400"
        "401":
          $ref: "#/components/responses/Erro401"
        "403":
          $ref: "#/components/responses/Erro403"
        "413":
          $ref: "#/components/responses/Erro413"
        "422":
          $ref: "#/components/responses/Erro422"
        "500":
          $ref: "#/components/responses/Erro500"
        "503":
          $ref: "#/components/responses/Erro503"
components:
  securitySchemes:
    CookieSessao:
      type: apiKey
      in: cookie
      name: leia.sid
      description: SID assinado e opaco, HttpOnly; sessão anônima somente para CSRF/login/cadastro. Sessão
        autenticada desserializa perfil/situação/versão atuais.
    TokenCsrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Token hexadecimal de 64 caracteres associado ao SID. Cookie e token devem vir da mesma
        sessão.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
      description: Identificador inteiro positivo.
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 9007199254740991
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 12
    Direction:
      name: direction
      in: query
      schema:
        type: string
        enum:
          - asc
          - desc
        default: asc
  responses:
    Erro400:
      description: JSON/corpo malformado ou requisição inválida.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
    Erro401:
      description: Credencial incorreta/conta indisponível ou sessão ausente, expirada ou revogada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
    Erro403:
      description: Perfil sem permissão ou CSRF ausente/incorreto.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
    Erro404:
      description: Alvo não encontrado, inclusive tentativa de alterar administrador por /usuarios.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
    Erro409:
      description: Duplicidade, dependência, concorrência ou transição conflitante.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
    Erro413:
      description: Corpo excede 102400 bytes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
    Erro422:
      description: Campos extras, PATCH vazio, valores ou referência inválidos.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
    Erro429:
      description: Limite de login/cadastro excedido por IP e janela.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
      headers:
        Retry-After:
          description: Segundos até liberação da janela.
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
    Erro500:
      description: Erro interno seguro.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
    Erro503:
      description: Banco/store temporariamente indisponível; sem dados inventados.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
